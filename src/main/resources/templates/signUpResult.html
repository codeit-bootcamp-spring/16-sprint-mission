<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 완료 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            overflow: hidden;
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .banner {
            height: 96px;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
        }

        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -48px;
            padding: 0 28px;
        }


        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 6px solid #fff;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }


        .check {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 16px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.12);
            color: #15803d;
            font-size: 13px;
            font-weight: 600;
        }

        h1 {
            margin-top: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .info {
            margin: 24px 28px 0;
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 14px 16px;
        }
        .row + .row { border-top: 1px solid var(--line); }

        .label {
            flex-shrink: 0;
            color: var(--muted);
            font-size: 13px;
            font-weight: 600;
        }

        .value {
            font-size: 14px;
            font-weight: 600;
            text-align: right;
            word-break: break-all;
        }



        .actions {
            display: flex;
            gap: 10px;
            padding: 24px 28px 28px;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }
        .btn-secondary {
            color: var(--text);
            background: #f1f2f6;
        }
        .btn-secondary:hover { background: #e6e8ef; }
    </style>
</head>
<body>
<main class="card">
    <div class="banner"></div>

    <section class="profile">
        <div class="avatar"
             th:text="${#strings.isEmpty(username)} ? '?' : ${#strings.substring(username, 0, 1)}">U</div>

        <span class="check">✓ 회원가입 완료</span>
        <h1>환영합니다, <span th:text="${username}">username</span>님!</h1>
        <p class="subtitle">계정이 성공적으로 생성되었습니다.</p>
    </section>

    <section class="info">
        <div class="row">
            <span class="label">사용자 이름</span>
            <span class="value" th:text="${username}">username</span>
        </div>
        <div class="row">
            <span class="label">이메일</span>
            <span class="value" th:text="${email}">user@example.com</span>
        </div>
    </section>

    <div class="actions">
        <a class="btn btn-secondary" th:href="@{/signup}" href="/signup">다른 계정 만들기</a>
        <a class="btn btn-primary" th:href="@{/}" href="/">로그인하기</a>
    </div>
</main>
</body>
</html>
