<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --input-bg: #f6f7fb;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(88, 101, 242, 0.4);
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        form { margin-top: 28px; }

        .field + .field { margin-top: 16px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        input::placeholder { color: #a3a7ba; }
        input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.15);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            margin-top: 24px;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 24px 0;
            color: var(--muted);
            font-size: 12px;
        }
        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .btn-secondary {
            color: var(--accent);
            background: rgba(88, 101, 242, 0.08);
            border: 1.5px solid rgba(88, 101, 242, 0.25);
        }
        .btn-secondary:hover { background: rgba(88, 101, 242, 0.14); }
    </style>
</head>
<body>
<main class="card">
    <div class="logo">D</div>
    <h1>다시 만나서 반가워요!</h1>
    <p class="subtitle">Discodeit 계정으로 로그인하세요.</p>

    <form th:action="@{/v1/users/login}" action="/v1/users/login" method="post">
        <div class="field">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" placeholder="아이디를 입력하세요"
                   autocomplete="username" required>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"
                   autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
    </form>

    <div class="divider">계정이 없으신가요?</div>

    <a class="btn btn-secondary" th:href="@{/signup}" href="/signup">회원가입</a>
</main>
</body>
</html>
