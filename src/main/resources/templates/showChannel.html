<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채널 정보 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 36px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(88, 101, 242, 0.12);
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
        }

        h1 {
            margin-top: 12px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            overflow-wrap: anywhere;
        }

        .description {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .info {
            margin-top: 24px;
            border-top: 1px solid var(--line);
        }

        .row {
            padding: 14px 0;
            border-bottom: 1px solid var(--line);
        }

        .label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }

        .value {
            margin-top: 4px;
            font-size: 14px;
            line-height: 1.5;
            list-style: none;
            overflow-wrap: anywhere;
        }

        .actions {
            display: flex;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 13px 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            transition: transform 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }
    </style>
</head>
<body>
<main class="card" th:with="isPrivate=${channel.channelType().name() == 'PRIVATE'}">
    <span class="badge" th:text="${isPrivate} ? '비공개 채널' : '공개 채널'">공개 채널</span>
    <h1 th:text="${isPrivate} ? '비공개 채널' : ${channel.name()}">채널 이름</h1>
    <p class="description" th:unless="${isPrivate}" th:text="${channel.description()}">채널 설명</p>

    <div class="info">
        <div class="row">
            <p class="label">채널 ID</p>
            <p class="value" th:text="${channel.id()}">00000000-0000-0000-0000-000000000000</p>
        </div>
        <div class="row">
            <p class="label">최근 메시지</p>
            <p class="value" th:text="${channel.lastMessageAt()} ?: '아직 메시지가 없어요'">아직 메시지가 없어요</p>
        </div>
        <div class="row" th:if="${isPrivate}">
            <p class="label">참여자</p>
            <ul class="value">
                <li th:each="participantId : ${channel.participantIds()}" th:text="${participantId}">
                    00000000-0000-0000-0000-000000000000
                </li>
            </ul>
        </div>
    </div>

    <div class="actions">
        <a class="btn" th:href="@{/}" href="/">처음으로</a>
    </div>
</main>
</body>
</html>
