<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보 수정 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --input-bg: #f6f7fb;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        form { margin-top: 28px; }

        /* 프로필 업로드 */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .avatar {
            position: relative;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.25);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s ease;
        }
        .avatar:hover { transform: scale(1.03); }

        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 34px;
        }
        .avatar.has-image .avatar-placeholder { display: none; }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 40, 0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .avatar:hover .avatar-overlay { opacity: 1; }

        .profile input[type="file"] { display: none; }

        .file-name {
            font-size: 12px;
            color: var(--muted);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .field + .field { margin-top: 16px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .field input::placeholder { color: #a3a7ba; }
        .field input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.15);
        }

        .hint {
            margin-top: 20px;
            padding: 12px 14px;
            border-radius: 10px;
            background: rgba(88, 101, 242, 0.07);
            color: #4b5068;
            font-size: 12px;
            line-height: 1.5;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 13px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            flex: 2;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .btn-secondary {
            color: var(--text);
            background: #f1f2f6;
        }
        .btn-secondary:hover { background: #e6e8ef; }
    </style>
</head>
<body>
<main class="card">
    <h1>회원정보 수정</h1>
    <p class="subtitle">바꾸고 싶은 항목만 입력하세요.</p>

    <form id="updateForm" th:action="@{/v1/users/update}" action="/v1/users/update"
          method="post" enctype="multipart/form-data">

        <div class="profile">
            <label class="avatar" id="avatar" for="profileImage" title="프로필 사진 변경">
                <span class="avatar-placeholder">👤</span>
                <span class="avatar-overlay">사진 변경</span>
            </label>
            <input type="file" id="profileImage" name="profileImage" accept="image/*">
            <span class="file-name" id="fileName">프로필 사진을 눌러 이미지를 선택하세요</span>
        </div>

        <div class="field">
            <label for="username">새 아이디</label>
            <input type="text" id="username" name="username" placeholder="변경할 아이디"
                   autocomplete="username">
        </div>
        <div class="field">
            <label for="password">새 비밀번호</label>
            <input type="password" id="password" name="password" placeholder="변경할 비밀번호"
                   autocomplete="new-password">
        </div>

        <p class="hint">비워 둔 항목은 기존 값이 그대로 유지돼요.</p>

        <div class="actions">
            <a class="btn btn-secondary" href="javascript:history.back()">취소</a>
            <button type="submit" class="btn btn-primary">수정하기</button>
        </div>
    </form>
</main>

<script>
    // 선택한 프로필 이미지 미리보기
    const fileInput = document.getElementById('profileImage');
    const avatar = document.getElementById('avatar');
    const fileName = document.getElementById('fileName');

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) return;
        fileName.textContent = file.name;
        const reader = new FileReader();
        reader.onload = e => {
            avatar.style.backgroundImage = `url('${e.target.result}')`;
            avatar.classList.add('has-image');
        };
        reader.readAsDataURL(file);
    });

    // 비워 둔 항목은 전송하지 않아서 서버에서 null로 받도록 함 (빈 문자열로 덮어쓰기 방지)
    document.getElementById('updateForm').addEventListener('submit', () => {
        document.querySelectorAll('#updateForm .field input').forEach(input => {
            if (input.value.trim() === '') input.disabled = true;
        });
        if (fileInput.files.length === 0) fileInput.disabled = true;
    });

    // 뒤로가기로 돌아왔을 때 비활성화된 칸 복구
    window.addEventListener('pageshow', () => {
        document.querySelectorAll('#updateForm input').forEach(input => input.disabled = false);
    });
</script>
</body>
</html>
