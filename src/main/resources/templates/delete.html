<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>탈퇴 완료 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 44px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            text-align: center;
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .icon {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            border-radius: 50%;
            background: #f1f2f6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
        }

        .notice {
            margin-top: 24px;
            padding: 14px 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            text-align: left;
            font-size: 13px;
            color: #4b5068;
            line-height: 1.7;
        }
        .notice li { margin-left: 18px; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 28px;
        }

        .btn {
            flex: 1;
            padding: 13px 0;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .btn-secondary {
            color: var(--text);
            background: #f1f2f6;
        }
        .btn-secondary:hover { background: #e6e8ef; }
    </style>
</head>
<body>
<main class="card">
    <div class="icon">👋</div>
    <h1>탈퇴가 완료되었어요</h1>
    <p class="subtitle">그동안 Discodeit을 이용해 주셔서 감사합니다.<br>언제든 다시 찾아와 주세요.</p>

    <ul class="notice">
        <li>계정 정보와 프로필 이미지가 삭제되었어요.</li>
        <li>같은 아이디로 다시 가입할 수 있어요.</li>
    </ul>

    <div class="actions">
        <a class="btn btn-secondary" th:href="@{/}" href="/">처음으로</a>
        <a class="btn btn-primary" th:href="@{/signup}" href="/signup">새로 가입하기</a>
    </div>
</main>
</body>
</html>
