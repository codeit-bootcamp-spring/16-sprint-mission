<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청 오류 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 44px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            text-align: center;
        }

        .status {
            color: #dc2626;
            font-size: 40px;
            font-weight: 800;
        }

        h1 {
            margin-top: 8px;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .message {
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .btn {
            display: block;
            margin-top: 28px;
            padding: 13px 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main class="card">
    <p class="status" th:text="${errorResponse.status()}">400</p>
    <h1>요청을 처리할 수 없어요</h1>
    <p class="message" th:text="${errorResponse.message()}">오류 메시지</p>
    <a class="btn" th:href="@{/}" href="/static">처음으로</a>
</main>
</body>
</html>
