<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 목록 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
            --online: #22c55e;
            --offline: #9aa0b4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 48px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
            background-attachment: fixed;
        }

        .card {
            width: 100%;
            max-width: 640px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            overflow: hidden;
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* 헤더 */
        .header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            padding: 28px 28px 20px;
            border-bottom: 1px solid var(--line);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 4px;
            color: var(--muted);
            font-size: 14px;
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .stat {
            padding: 6px 12px;
            border-radius: 999px;
            background: #f1f2f6;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
            white-space: nowrap;
        }
        .stat.online {
            background: rgba(34, 197, 94, 0.12);
            color: #16a34a;
        }

        /* 목록 */
        .list { list-style: none; }

        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 28px;
            transition: background 0.15s ease;
        }
        .item + .item { border-top: 1px solid var(--line); }
        .item:hover { background: #f8f8fc; }

        .avatar {
            position: relative;
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .dot {
            position: absolute;
            right: -1px;
            bottom: -1px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 3px solid #fff;
            background: var(--offline);
        }
        .dot.online { background: var(--online); }

        .info {
            flex: 1;
            min-width: 0;
        }

        .name {
            font-size: 15px;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .email {
            margin-top: 2px;
            font-size: 13px;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .id {
            margin-top: 4px;
            font-family: "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            color: #a3a7ba;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            flex-shrink: 0;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            background: #f1f2f6;
            color: var(--offline);
        }
        .badge.online {
            background: rgba(34, 197, 94, 0.12);
            color: #16a34a;
        }

        /* 빈 목록 */
        .empty {
            padding: 56px 28px;
            text-align: center;
            color: var(--muted);
        }
        .empty-icon { font-size: 40px; }
        .empty p { margin-top: 12px; font-size: 14px; }

        /* 하단 */
        .footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding: 20px 28px;
            border-top: 1px solid var(--line);
        }

        .btn {
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .btn-secondary {
            color: var(--text);
            background: #f1f2f6;
        }
        .btn-secondary:hover { background: #e6e8ef; }

        @media (max-width: 520px) {
            .header { flex-direction: column; align-items: flex-start; }
            .item, .header, .footer { padding-left: 18px; padding-right: 18px; }
            .id { display: none; }
        }
    </style>
</head>
<body>
<main class="card">
    <header class="header">
        <div>
            <h1>사용자 목록</h1>
            <p class="subtitle">Discodeit에 등록된 모든 사용자예요.</p>
        </div>
        <div class="stats">
            <span class="stat">전체 <span th:text="${#lists.size(userList)}">0</span>명</span>
            <span class="stat online">온라인
                <span th:text="${userList.?[isOnline()].size()}">0</span>명</span>
        </div>
    </header>

    <ul class="list" th:unless="${#lists.isEmpty(userList)}">
        <li class="item" th:each="user : ${userList}">
            <div class="avatar">
                <span th:text="${#strings.isEmpty(user.username())} ? '?' : ${#strings.substring(user.username(), 0, 1)}">U</span>
                <span class="dot" th:classappend="${user.isOnline()} ? 'online'"></span>
            </div>
            <div class="info">
                <p class="name" th:text="${user.username()}">username</p>
                <p class="email" th:text="${user.email()}">user@example.com</p>
                <p class="id" th:text="${user.userId()}">00000000-0000-0000-0000-000000000000</p>
            </div>
            <span class="badge"
                  th:classappend="${user.isOnline()} ? 'online'"
                  th:text="${user.isOnline()} ? '온라인' : '오프라인'">오프라인</span>
        </li>
    </ul>

    <div class="empty" th:if="${#lists.isEmpty(userList)}">
        <div class="empty-icon">🫥</div>
        <p>아직 등록된 사용자가 없어요.</p>
    </div>

    <footer class="footer">
        <a class="btn btn-secondary" th:href="@{/}" href="/">처음으로</a>
        <a class="btn btn-primary" th:href="@{/signup}" href="/signup">회원가입</a>
    </footer>
</main>
</body>
</html>
