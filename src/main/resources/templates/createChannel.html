<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채널 만들기 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 480px;
            padding: 36px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        section {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--line);
        }

        h2 {
            font-size: 16px;
            font-weight: 700;
        }

        .hint {
            margin-top: 4px;
            color: var(--muted);
            font-size: 13px;
        }

        .field {
            margin-top: 16px;
        }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            margin-top: 6px;
            padding: 12px 14px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            font: inherit;
            font-size: 14px;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
            font-weight: 500;
            cursor: pointer;
        }

        .user small {
            color: var(--muted);
            overflow-wrap: anywhere;
        }

        .btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 13px 0;
            border: 0;
            border-radius: 10px;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            font: inherit;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            margin-top: 24px;
            color: var(--text);
            background: #f1f2f6;
        }
    </style>
</head>
<body>
<main class="card">
    <h1>채널 만들기</h1>

    <section>
        <h2>공개 채널</h2>
        <p class="hint">모든 사용자가 볼 수 있는 채널이에요.</p>
        <form th:action="@{/v1/channels/public}" action="/v1/channels/public" method="post">
            <div class="field">
                <label for="name">채널 이름</label>
                <input type="text" id="name" name="name" placeholder="채널 이름을 입력하세요" required>
            </div>
            <div class="field">
                <label for="description">채널 설명</label>
                <input type="text" id="description" name="description" placeholder="채널 설명을 입력하세요">
            </div>
            <button type="submit" class="btn">공개 채널 만들기</button>
        </form>
    </section>

    <section>
        <h2>비공개 채널</h2>
        <p class="hint">선택한 사용자만 참여하는 채널이에요. 1명 이상 선택해 주세요.</p>
        <form th:action="@{/v1/channels/private}" action="/v1/channels/private" method="post">
            <div class="field">
                <label class="user" th:each="user : ${userList}">
                    <input type="checkbox" name="userList" th:value="${user.userId()}">
                    <span>
                        <span th:text="${user.username()}">username</span>
                        <small th:text="${user.email()}">user@example.com</small>
                    </span>
                </label>
            </div>
            <button type="submit" class="btn" th:disabled="${#lists.isEmpty(userList)}">비공개 채널 만들기</button>
        </form>
    </section>

    <a class="btn btn-secondary" th:href="@{/}" href="/">처음으로</a>
</main>
</body>
</html>
