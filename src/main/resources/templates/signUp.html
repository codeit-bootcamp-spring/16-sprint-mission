<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --input-bg: #f6f7fb;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 40px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 56px;
            height: 56px;
            margin: 0 auto;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 26px;
            font-weight: 800;
            box-shadow: 0 10px 24px rgba(88, 101, 242, 0.4);
        }

        h1 {
            margin-top: 20px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-align: center;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        form { margin-top: 28px; }

        /* 프로필 업로드 */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .avatar {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #a5b4fc, #c4b5fd);
            background-size: cover;
            background-position: center;
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.25);
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.15s ease;
        }
        .avatar:hover { transform: scale(1.03); }

        .avatar-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 34px;
        }
        .avatar.has-image .avatar-placeholder { display: none; }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 20, 40, 0.55);
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            opacity: 0;
            transition: opacity 0.15s ease;
        }
        .avatar:hover .avatar-overlay { opacity: 1; }

        .profile input[type="file"] { display: none; }

        .file-name {
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 12px;
            color: var(--muted);
        }

        .file-remove {
            display: none;
            padding: 0;
            border: none;
            background: none;
            color: #ef4444;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .file-remove.visible { display: inline; }

        .field + .field { margin-top: 16px; }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        .required { color: #ef4444; margin-left: 2px; }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1.5px solid var(--line);
            border-radius: 10px;
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        input::placeholder { color: #a3a7ba; }
        input:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(88, 101, 242, 0.15);
        }

        .hint {
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 13px 0;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn-primary {
            margin-top: 28px;
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
            color: var(--muted);
        }
        .footer a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<main class="card">
    <div class="logo">D</div>
    <h1>계정 만들기</h1>
    <p class="subtitle">몇 가지 정보만 입력하면 바로 시작할 수 있어요.</p>

    <form th:action="@{/v1/users}" action="/v1/users" method="post" enctype="multipart/form-data">
        <div class="profile">
            <label class="avatar" id="avatar" for="profile" title="프로필 사진 선택">
                <span class="avatar-placeholder">👤</span>
                <span class="avatar-overlay">사진 선택</span>
            </label>
            <input type="file" id="profile" name="profile" accept="image/*">
            <span class="file-name" id="fileName">프로필 사진 (선택)</span>
            <button type="button" class="file-remove" id="fileRemove">사진 지우기</button>
        </div>

        <div class="field">
            <label for="username">아이디<span class="required">*</span></label>
            <input type="text" id="username" name="username" placeholder="사용할 아이디를 입력하세요"
                   autocomplete="username" required>
        </div>
        <div class="field">
            <label for="email">이메일<span class="required">*</span></label>
            <input type="email" id="email" name="email" placeholder="you@example.com"
                   autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">비밀번호<span class="required">*</span></label>
            <input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요"
                   autocomplete="new-password" required>
            <p class="hint">다른 사이트와 다른 비밀번호를 사용하는 것을 권장해요.</p>
        </div>
        <button type="submit" class="btn btn-primary">가입하기</button>
    </form>

    <p class="footer">이미 계정이 있으신가요? <a th:href="@{/}" href="/">로그인</a></p>
</main>

<script>
    // 선택한 프로필 사진 미리보기
    const fileInput = document.getElementById('profile');
    const avatar = document.getElementById('avatar');
    const fileName = document.getElementById('fileName');
    const fileRemove = document.getElementById('fileRemove');

    function resetPreview() {
        avatar.style.backgroundImage = '';
        avatar.classList.remove('has-image');
        fileName.textContent = '프로필 사진 (선택)';
        fileRemove.classList.remove('visible');
    }

    fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (!file) {
            resetPreview();
            return;
        }
        fileName.textContent = file.name;
        fileRemove.classList.add('visible');
        const reader = new FileReader();
        reader.onload = e => {
            avatar.style.backgroundImage = `url('${e.target.result}')`;
            avatar.classList.add('has-image');
        };
        reader.readAsDataURL(file);
    });

    fileRemove.addEventListener('click', () => {
        fileInput.value = '';
        resetPreview();
    });
</script>
</body>
</html>
