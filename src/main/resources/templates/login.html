<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 완료 · Discodeit</title>
    <style>
        :root {
            --bg-1: #1e1f3b;
            --bg-2: #3b2f6b;
            --card: rgba(255, 255, 255, 0.96);
            --text: #1f2333;
            --muted: #6b7088;
            --line: #e7e8f0;
            --accent: #5865f2;
            --accent-2: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                         "Segoe UI", "Malgun Gothic", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.35), transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(88, 101, 242, 0.35), transparent 45%),
                linear-gradient(135deg, var(--bg-1), var(--bg-2));
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px 32px;
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(10, 10, 30, 0.45);
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            background: #fef3c7;
            color: #92400e;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .head { text-align: center; }

        .check {
            width: 56px;
            height: 56px;
            margin: 16px auto 0;
            border-radius: 50%;
            background: rgba(34, 197, 94, 0.12);
            color: #16a34a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
        }

        h1 {
            margin-top: 16px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .subtitle {
            margin-top: 6px;
            color: var(--muted);
            font-size: 14px;
        }

        .section-title {
            margin: 28px 0 12px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
        }

        form { margin: 0; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-align: left;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }
        .btn:hover { transform: translateY(-1px); }

        .btn small {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            font-weight: 500;
            opacity: 0.8;
        }

        .btn-primary {
            color: #fff;
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            box-shadow: 0 8px 20px rgba(88, 101, 242, 0.35);
        }

        .btn-outline {
            margin-top: 12px;
            color: var(--accent);
            background: rgba(88, 101, 242, 0.08);
            border: 1.5px solid rgba(88, 101, 242, 0.25);
        }
        .btn-outline:hover { background: rgba(88, 101, 242, 0.14); }

        .btn-danger {
            margin-top: 12px;
            color: #dc2626;
            background: rgba(239, 68, 68, 0.08);
            border: 1.5px solid rgba(239, 68, 68, 0.3);
        }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.14); }

        .btn-ghost {
            margin-top: 12px;
            justify-content: center;
            color: var(--muted);
            background: #f1f2f6;
        }
        .btn-ghost:hover { background: #e6e8ef; }
    </style>
</head>
<body>
<main class="card">
    <div class="head">
        <span class="tag">TEST PAGE</span>
        <div class="check">✓</div>
        <h1>로그인 성공</h1>
        <p class="subtitle">아래 버튼으로 기능을 테스트할 수 있어요.</p>
    </div>

    <p class="section-title">기능 테스트</p>

    <a class="btn btn-primary" th:href="@{/v1/users/update}" href="/v1/users/update">
        <span>
            회원정보 수정
            <small>GET /v1/users/update</small>
        </span>
        <span>→</span>
    </a>

    <a class="btn btn-outline" th:href="@{/v1/users}" href="/v1/users">
        <span>
            사용자 목록
            <small>GET /v1/users</small>
        </span>
        <span>→</span>
    </a>

    <form th:action="@{/v1/users/delete}" th:method="delete" action="/v1/users/delete" method="post"
          onsubmit="return confirm('정말 계정을 삭제할까요? 삭제한 계정은 되돌릴 수 없어요.');">
        <button type="submit" class="btn btn-danger">
            <span>
                회원 탈퇴
                <small>DELETE /v1/users/delete</small>
            </span>
            <span>→</span>
        </button>
    </form>

    <a class="btn btn-ghost" th:href="@{/}" href="/">처음으로</a>
</main>
</body>
</html>
