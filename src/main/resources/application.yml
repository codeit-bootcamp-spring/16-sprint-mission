server:
  port: ${PORT:8080}

spring:
  application:
    name: discodeit

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB

discodeit:
  repository:
    type: ${DISCODEIT_REPOSITORY_TYPE:jcf}
    file-directory: ${DISCODEIT_REPOSITORY_FILE_DIRECTORY:data}