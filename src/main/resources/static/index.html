<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>사용자 목록</title>

    <link rel="stylesheet" href="/styles.css">
    <script src="/script.js" defer></script>
</head>
<body>

<header class="browser-bar">
    <span class="browser-info">ℹ</span>
    <span class="browser-url" id="browserUrl">
        http://localhost:8080
    </span>
</header>

<main class="page">
    <div class="container">

        <h1>사용자 목록</h1>

        <section
                class="user-list"
                id="userList"
                aria-label="사용자 목록"
                aria-live="polite"
        >
            <p class="state-message">
                사용자 목록을 불러오는 중입니다.
            </p>
        </section>

    </div>
</main>

</body>
</html>
